name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.runner }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.33.2 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: '0.11.32'

      - name: Sync Python dependencies
        run: uv sync --project apps/agent-service --group test --locked

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test workspaces
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check workspaces
        run: pnpm check

      - name: Verify renderer boundaries
        run: pnpm verify:boundaries

      - name: Verify skill governance
        run: pnpm verify:skills

      - name: Verify native architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') { throw new Error('unexpected architecture ' + process.arch); }"

      - name: Package desktop app
        run: pnpm --filter @museworks/desktop --fail-if-no-match package

      - name: Verify packaged ASAR
        run: node scripts/verify-packaged-asar.mjs
